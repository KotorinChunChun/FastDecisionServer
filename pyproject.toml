[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fast-decision-server"
version = "0.1.0"
description = "モデル交換可能な共用判定サーバー"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "pillow==12.3.0", "httpx==0.28.1"]

[project.scripts]
fds = "fds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fds"]
